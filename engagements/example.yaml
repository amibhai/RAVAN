# RAVAN engagement scope — sample.
#
# This file is the authorized-use allow-list. The engine loads it and refuses to
# act against any target, tactic, technique, permission, or time outside it.
# Copy it per engagement; never point RAVAN at infrastructure you are not
# explicitly authorized to test.

name: home-lab-range
description: >
  Authorized scope for the personal home lab / CTF range only. All targets are
  RFC 1918 / lab-local hosts under the operator's control.
operator: swastik

scope:
  # Allowed targets. Accepts hostnames (exact match) and IPs or CIDR networks
  # (membership match). A target not covered here is refused and logged.
  targets:
    - 10.10.0.0/24
    - 192.168.56.0/24
    - lab.local
    - target01.lab.local

  # ATT&CK tactics the engagement authorizes. A head whose tactic is not listed
  # is refused before it runs. Phase 0 ships only the reconnaissance head.
  allowed_tactics:
    - reconnaissance
    - resource-development
    - credential-access
    - lateral-movement

  # Optional finer-grained technique allow-list. Empty means "any technique
  # within an allowed tactic". Populate with ATT&CK IDs (e.g. T1595) to restrict.
  allowed_techniques: []

  # Capabilities the engagement grants. A head declares required_permissions;
  # the engine refuses to run it unless every one is granted here.
  permissions:
    - active-scan
    - passive-recon
    - wordlist-generation
    - credential-attack
    - lateral-movement

  # Engagement time window (ISO-8601). Actions outside it are refused. Either
  # bound may be omitted to leave that side open.
  time_window:
    start: 2026-08-01T00:00:00Z
    end: 2026-12-31T23:59:59Z

# Per-head configuration. Merged under the engine's scope enforcement; CLI
# --option key=value overrides any value here. Domains referenced by a head
# (e.g. resdev's target domain) must still be inside scope.targets above.
heads:
  recon:
    operations: [discover, portscan, services, vuln, dns, tls, http]
    ports: top100          # top20 | top100 | top1000 | all | "22,80,443" | "1-1024"
    timeout: 1.5           # per-connection seconds
    workers: 100           # concurrent probes
    max_hosts: 256         # CIDR expansion cap
    dns_subdomains: true
    # dns_resolver: 10.10.0.1   # optional: enumerate NS/MX/TXT via this resolver

  resdev:
    company: "Acme Corp"
    domain: lab.local              # must be in scope.targets
    employees: ["Rahul Sharma", "Priya Patel"]
    location: Mumbai
    founded_year: "2011"
    keywords: [acme, widgets]
    max_words: 50000
    export_rules: true
    rules_tier: standard           # basic | standard | exhaustive

  credaccess:
    protocol: ssh                  # ftp|ssh|http-basic|http-form|smtp|pop3|imap|telnet|redis
    mode: defaults                 # dictionary|spray|smart|defaults|combo
    # users: [admin, root]
    # passwords: [Password1!, Summer2026!]
    # company: "Acme Corp"         # used by 'smart' mode
    timeout: 5.0
    workers: 8
    lockout_threshold: 5           # skip a user nearing lockout
    lockout_window: 300
    stop_on_success: true
    # delay: 0.0                    # per-attempt delay + jitter for rate control
    # jitter: 0.0

  lateral:
    protocols: [ssh]               # protocols to test for credential reuse
    # credentials: ["admin:Password1!"]   # or discovered by the credaccess head
    # creds_file: found_creds.txt
    timeout: 5.0
    workers: 16
    max_hosts: 256                 # CIDR expansion cap when reusing across a subnet
